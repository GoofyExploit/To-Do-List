<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <title>Login | Register - Todo App</title>
  <link rel="stylesheet" href="./resources/css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./resources/img/icon.svg" type="image/x-icon">
</head>

<body>
  <div class="container">
    <input type="checkbox" id="flip">
    <div class="cover">
      <div class="front">
        <div class="text">
          <span class="text-1">Every new friend is a <br> new adventure</span>
          <span class="text-2">Let's get connected</span>
        </div>
      </div>
      <div class="back">
        <div class="text">
          <span class="text-1">Complete miles of journey <br> with one step</span>
          <span class="text-2">Let's get started</span>
        </div>
      </div>
    </div>
    <div class="forms">
      <div class="form-content">
        <div class="login-form">
          <div class="title">Login</div>
          <form id="loginForm">
            <div class="input-boxes">
              <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="text" placeholder="Enter your email" required>
              </div>
              <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter your password" required>
              </div>
              <div class="text"><a href="#" style="color: black;">Forgot password?</a></div>
              <div class="button input-box">
                <input type="submit" value="Submit">
              </div>
              <div class="text sign-up-text">Don't have an account? <label for="flip">Signup now</label></div>
            </div>
          </form>
        </div>

        <div class="signup-form">
          <div class="title">Signup</div>
          <form id="signupForm">
            <div class="input-boxes">
              <div class="input-box">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Enter your name" required>
              </div>
              <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" placeholder="Enter your email" required>
              </div>
              <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter your password" required>
              </div>
              <div class="button input-box">
                <input type="submit" value="Submit">
              </div>
              <div class="text sign-up-text">Already have an account? <label for="flip">Login now</label></div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://to-do-list-ddgt.onrender.com';

    document.querySelector('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.querySelector('#loginForm input[type="text"]').value;
      const password = document.querySelector('#loginForm input[type="password"]').value;

      try {
        const response = await fetch(`${BASE_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();
        console.log(data);

        if (data.message === 'Login successful') {
          localStorage.setItem('isLoggedIn', 'true'); 
          window.location.href = '/app.html';     
        }
        else {
          alert('Invalid credentials');
        }
      } catch (error) {
        console.log('Error:', error);
      }
    });

    document.querySelector('#signupForm').addEventListener('submit', async (e) => {
      e.preventDefault(); 

      const name = document.querySelector('#signupForm input[type="text"]').value;
      const email = document.querySelector('#signupForm input[type="email"]').value;  
      const password = document.querySelector('#signupForm input[type="password"]').value;

      try {
        const response = await fetch(`${BASE_URL}/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();
        console.log(data);

        if (data.status === 201) {
          alert('Signup successful');
        } else {
          alert(data.message);
        }
      } catch (error) {
        console.log('Error:', error);
        alert('Error during signup');
      }
    });
  </script>
</body>

</html>
