<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="resources/css/app.css">
    <link rel="stylesheet" href="resources/css/legal-popup-index.css">
    <link rel="icon" href="resources/img/icon.svg" type="svg/x-icon">
    <link rel="shortcut icon" href="resources/img/icon.svg" type="svg/x-icon">
    <title translate="no">To-Do List</title>
    <script>
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn !== 'true') {
            window.location.href = '/index.html';
        }
    </script>

</head>

<body>
    <div class="nav">
        <a href="app.html"><img src="./resources/img/home.png" alt=""></a>
        <button onclick="logout()"><img src="./resources/img/logout.png" alt=""></button>
    </div>
    <div class="background"></div>
    <div class="heading">
        <h1 Todo List App</h1>Todo App</h1>
    </div>
    <div class="container">
        <input type="text" style="padding-left: 10px;" id="taskInput" placeholder="Add a task...">
        <button id="add-btn" onclick="addTask()">Add<i class="fas fa-plus-circle"></i></button>
        <div id="taskList"></div>
    </div>

    <div id="popup-overlay"></div>
    <div id="legal-popup-container">
        <span id="legal-popup-close">&times;</span>


        <br>
    </div>
    <script src="resources/scripts/app.js"></script>
    <script src="resources/scripts/legal-popup-index.js"></script>
    <script>
        function logout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = '/index.html';
        }
    </script>
</body>

</html>
